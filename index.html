<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator - Game Controller</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0f111a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1a1d2d;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #2d324f;
      width: 90%;
      max-width: 400px;
    }
    h2 {
      margin-bottom: 5px;
      color: #e50b2e;
      font-style: italic;
    }
    .status {
      margin-bottom: 25px;
      color: #8c90b5;
      font-size: 14px;
    }
    .status span {
      font-weight: bold;
      font-size: 16px;
      text-transform: uppercase;
    }
    .btn {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 2px solid transparent;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: 0.2s;
      opacity: 0.55;
    }
    .btn.active-mode {
      opacity: 1;
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-normal { background-color: #28a745; }
    .btn-auto { background-color: #ff9800; }
    .btn-lost { background-color: #e50b2e; }
    
    .message {
      height: 20px;
      font-size: 14px;
      color: #28a745;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>AVIATOR CONTROLLER</h2>
    <div class="status">Current Mode: <span id="currentMode">Loading...</span></div>

    <button id="btnNormal" class="btn btn-normal" onclick="setMode('normal')">NORMAL MODE (Chart)</button>
    <button id="btnAuto" class="btn btn-auto" onclick="setMode('auto')">AUTO MODE (AI - Bet = Lost)</button>
    <button id="btnLost" class="btn btn-lost" onclick="setMode('lost')">LOST MODE (Always 1x-2x)</button>

    <div class="message" id="msg"></div>
  </div>

  <script>
    const supabaseUrl = 'https://vtobhkwzvwaaxxtikxfq.supabase.co';
    const supabaseKey = 'sb_publishable_839dZUvDqZvNy9n5HtIttA_Nz3cWsdn';
    
    // cache: 'no-store' දමා ඇති නිසා Back වී ආවත් සැමවිටම Database එකේ අලුත්ම Mode එක ලබා ගනී
    const controlSupabase = window.supabase.createClient(supabaseUrl, supabaseKey, {
      global: {
        fetch: (url, options) => fetch(url, { ...options, cache: 'no-store' })
      }
    });

    let activeRowId = 1;

    async function loadCurrentMode() {
      const { data, error } = await controlSupabase
        .from('game_state')
        .select('id, game_mode')
        .order('id', { ascending: true })
        .limit(1)
        .maybeSingle();

      if (!error && data) {
        activeRowId = data.id;
        updateUI(data.game_mode || 'normal');
      } else {
        // localStorage fallback if row isn't loaded yet
        const saved = localStorage.getItem('aviator_saved_game_mode');
        if (saved) updateUI(saved);
      }
    }

    function updateUI(mode) {
      const normalized = (mode || 'normal').toLowerCase();
      try { localStorage.setItem('aviator_saved_game_mode', normalized); } catch {}

      const modeText = document.getElementById('currentMode');
      document.getElementById('btnNormal').classList.toggle('active-mode', normalized === 'normal');
      document.getElementById('btnAuto').classList.toggle('active-mode', normalized === 'auto');
      document.getElementById('btnLost').classList.toggle('active-mode', normalized === 'lost');

      if (normalized === 'lost') {
        modeText.innerText = 'LOST MODE';
        modeText.style.color = '#e50b2e';
      } else if (normalized === 'auto') {
        modeText.innerText = 'AUTO MODE';
        modeText.style.color = '#ff9800';
      } else {
        modeText.innerText = 'NORMAL MODE';
        modeText.style.color = '#28a745';
      }
    }

    async function setMode(mode) {
      const msgEl = document.getElementById('msg');
      msgEl.innerText = 'Updating...';
      msgEl.style.color = '#8c90b5';

      // Row එක update කරනවා, id=1 නැත්නම් upsert හරහා අලුතින් හදලා save කරනවා
      const { data, error } = await controlSupabase
        .from('game_state')
        .upsert({ id: activeRowId, game_mode: mode }, { onConflict: 'id' })
        .select('game_mode')
        .single();
      
      if (error) {
        msgEl.innerText = 'Error: Could not update mode!';
        msgEl.style.color = '#e50b2e';
      } else {
        msgEl.innerText = 'Mode successfully activated!';
        msgEl.style.color = '#28a745';
        updateUI(data?.game_mode || mode);
      }
      setTimeout(() => { msgEl.innerText = ''; }, 3000);
    }

    // Realtime Listener
    controlSupabase.channel('game_mode_sync')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_state' }, payload => {
        if (payload.new && payload.new.game_mode) {
          updateUI(payload.new.game_mode);
        }
      }).subscribe();

    // පේජ් එකෙන් Back ගිහින් ආයෙත් එනකොට සහ Tab මාරු කරනකොට Database එකෙන් Mode එක ගැනීම
    window.addEventListener('pageshow', loadCurrentMode);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadCurrentMode();
    });

    loadCurrentMode();
  </script>

</body>
</html>
